apiVersion: 1

groups:
  - name: system_alerts
    folder: General
    interval: 30s
    orgId: 1
    rules:
      - uid: high_cpu
        title: High CPU
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% for more than 5 minutes"

      - uid: high_memory
        title: High Memory
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for more than 5 minutes"

      - uid: disk_space
        title: Disk Space Critical
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 90
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "Disk usage is above 90% for more than 5 minutes"

      - uid: comin_down
        title: Comin Down
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="comin"} == 0
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Comin is down on {{ $labels.instance }}"
          description: "Comin service has been unavailable for 2 minutes"

      - uid: comin_failed
        title: Comin Failed
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: comin_deployment_info{status="failed"} == 1
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Comin deployment failed"
          description: "A Comin deployment has failed"

      - uid: jellyfin_down
        title: Jellyfin Down
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="jellyfin"} == 0
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Jellyfin is down on {{ $labels.instance }}"
          description: "Jellyfin service has been unavailable for 2 minutes"

      - uid: audiobookshelf_down
        title: Audiobookshelf Down
        condition: A
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: probe_success{job="audiobookshelf"} == 0
              refId: A
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Audiobookshelf is down on {{ $labels.instance }}"
          description: "Audiobookshelf service has been unavailable for 2 minutes"
