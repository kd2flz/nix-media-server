apiVersion: 1
groups:
  - name: system_alerts
    folder: monitoring
    interval: 30s
    rules:
      - title: High CPU
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 90"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% for more than 5 minutes"
        labels:
          severity: warning

      - title: High Memory
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for more than 5 minutes"
        labels:
          severity: warning

      - title: Disk Space Critical
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})) * 100 > 90"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "Disk usage is above 90% for more than 5 minutes"
        labels:
          severity: critical

      - title: Comin Down
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: "up{job=\"comin\"} == 0"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Comin is down on {{ $labels.instance }}"
          description: "Comin service has been unavailable for 2 minutes"
        labels:
          severity: critical

      - title: Jellyfin Down
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: "up{job=\"jellyfin\"} == 0"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Jellyfin is down on {{ $labels.instance }}"
          description: "Jellyfin service has been unavailable for 2 minutes"
        labels:
          severity: critical

      - title: Audiobookshelf Down
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 120
              to: 0
            model:
              expr: "probe_success{job=\"audiobookshelf\"} == 0"
              refId: A
              datasourceUid: "prometheus"
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Audiobookshelf is down on {{ $labels.instance }}"
          description: "Audiobookshelf service has been unavailable for 2 minutes"
        labels:
          severity: critical